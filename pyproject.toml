# pwr-tray -- basics, testing, and releasing
# ==========================================
#
# Basics
# ------
# * Build backend: flit_core.  The version lives in `pwr_tray/__init__.py`
#   only; never add `version =` to [project].  tests/test_metadata.py enforces
#   this because a second copy of the version is how the published metadata
#   drifted from the code before.
# * Layout: the package is `pwr_tray/`; runtime resources (commands.yaml,
#   icons, systemd units) live under `pwr_tray/resources/` and ride in the
#   wheel.  `pwr-tray` is the console script (pwr_tray.main:main).
# * `./runner` executes this source tree immediately (`python -m
#   pwr_tray.main`, with `--replace`), so it is always the newest code -- but
#   it is not what a systemd unit or a pipx shim runs.
#
# Full test of the working version
# --------------------------------
# Three layers can each name different code: the `pwr-tray` on $PATH, the
# ExecStart= of ~/.config/systemd/user/pwr-tray.service, and the process
# systemd is running right now.  `--svc-status` prints the middle one
# (`runs: ...`) and warns when it is not the executable on $PATH.  To make all
# three agree with this checkout:
#
#   pipx install --editable --force .   # $PATH -> this checkout
#   pwr-tray --version                  # must print pwr_tray.__version__
#   pwr-tray --svc-status               # `runs:` must be that executable
#   pwr-tray --svc-install              # rewrite a stale unit (explicit)
#   pwr-tray --svc-restart              # restart on the rewritten unit
#   pwr-tray --svc-status               # active, and running the right file
#   pwr-tray --follow-log               # watch what it actually says
#
# An editable install changes the code, not the unit file, and a running
# Python process keeps the modules it imported at startup: `--svc-install`
# and `--svc-start` cannot notice either change.  `--svc-restart` is the verb
# that applies a `pipx install --editable .` or a `git pull`.  A unit that
# names a different executable is refused by start/restart; run
# `--svc-install` first.
#
# Do not run `--svc-install` from an activated project virtualenv: the unit
# records the absolute path of the `pwr-tray` that `which` finds there, and
# that virtualenv may hold a copied (non-editable) package frozen at install
# time.
#
# The test gate, from a checkout with the `dev` extra installed:
#
#   python -m pip install -e '.[dev]'
#   python -m ruff check .
#   python -m compileall -q pwr_tray
#   python -m pytest -q                 # 300+ tests, about a second
#   python -m pytest -q --cov=pwr_tray  # optional coverage report
#
# Tests never touch ~/.config: conftest.py redirects HOME to a temporary
# directory and stubs PyQt5/ruamel.yaml/psutil when they are absent, so the
# suite runs in a bare container as well as on a desktop.
#
# Releasing
# ---------
#   1. bump `__version__` in pwr_tray/__init__.py (the only place)
#   2. run the test gate above; commit; tag `vX.Y.Z`; push with tags
#   3. python -m build                  # dist/*.whl and dist/*.tar.gz
#   4. python -m twine check dist/*
#   5. python -m twine upload dist/*    # TWINE_USERNAME=__token__,
#                                       # TWINE_PASSWORD=pypi-...
#   6. install the artifact into a scratch environment (pipx install
#      --force ./dist/pwr_tray-X.Y.Z-py3-none-any.whl) and check
#      `pwr-tray --version` and `pwr-tray --list-des`, so the index cannot
#      serve a wheel that the tree never ran (audit finding F1).

[build-system]
requires = ["flit_core>=3.4"]
build-backend = "flit_core.buildapi"

[project]
name = "pwr_tray"
description = "A PyQt5 tray applet for power management on i3, sway, niri, Hyprland, and KDE"
# `pwr_tray/__init__.py:__version__` is the single source of truth.  Flit reads
# it from the module at build time, so the version is never duplicated here.
dynamic = ["version"]
authors = [
    { name = "Joe Defen", email = "joedef@google.com" }
]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["power", "energy", "PyQt5", "applet", "tray", "kde", "i3wm", "sway", "niri", "hyprland"]
classifiers = [
    "Environment :: X11 Applications :: Qt",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux"
]
dependencies = [
    'psutil>=5.9',
    'PyQt5>=5.15',     # also supplies QtDBus, used for tray detection
    'ruamel.yaml>=0.17',
]

[project.urls]
"Homepage" = "https://github.com/joedefen/pwr-tray"
"Bug Tracker" = "https://github.com/joedefen/pwr-tray/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pytest-cov>=5",
    "ruff>=0.6",
    "build>=1.2",
    "twine>=5",
]

[project.scripts]
pwr-tray = "pwr_tray.main:main"

[tool.flit.sdist]
include = ["pwr_tray/resources/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
branch = true
source = ["pwr_tray"]

[tool.coverage.report]
skip_covered = true

[tool.ruff]
# Keep the lint gate identical on every machine: no global/user config can
# change which rules CI enforces.
target-version = "py311"
line-length = 100
extend-exclude = ["build", "dist", ".venv"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "F",      # pyflakes
    "W",      # pycodestyle warnings
    "I",      # import sorting
    "UP",     # pyupgrade
    "B",      # bugbear
    "SIM",    # simplify
    "RUF",    # ruff-specific
    "S",      # bandit (security)
    "BLE",    # blind except
    "ISC",    # implicit string concatenation
]
ignore = [
    "E501",   # a few long UI/log strings are clearer on one line
    # UI strings deliberately use typographic spaces (menu alignment).
    "RUF001", "RUF002", "RUF003",
    # Subprocess calls and config-sourced command lines are the application's
    # core mechanism; these bandit rules cannot distinguish them from injection.
    "S105", "S106", "S602", "S603", "S604", "S605", "S606", "S607",
]

[tool.ruff.lint.isort]
known-first-party = ["pwr_tray"]

[tool.ruff.lint.per-file-ignores]
# Assertions are the natural expression language of a test suite, and tests
# may name throw-away paths under /tmp.
"tests/*" = ["S101", "S108"]
"conftest.py" = ["S101"]
