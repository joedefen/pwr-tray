[build-system]
requires = ["flit_core>=3.4"]
build-backend = "flit_core.buildapi"

[project]
name = "pwr_tray"
version = "1.0.13"
description = "A PyQt5 tray applet for power management on i3, sway, niri, Hyprland, and KDE"
authors = [
    { name = "Joe Defen", email = "joedef@google.com" }
]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["power", "energy", "PyQt5", "applet", "tray", "kde", "i3wm", "sway", "niri", "hyprland"]
classifiers = [
    "Environment :: X11 Applications :: Qt",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux"
]
dependencies = [
    'psutil>=5.9',
    'PyQt5>=5.15',     # also supplies QtDBus, used for tray detection
    'ruamel.yaml>=0.17',
]

[project.urls]
"Homepage" = "https://github.com/joedefen/pwr-tray"
"Bug Tracker" = "https://github.com/joedefen/pwr-tray/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "ruff>=0.6",
]

[project.scripts]
pwr-tray = "pwr_tray.main:main"

[tool.flit.sdist]
include = ["pwr_tray/resources/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
# Keep the lint gate identical on every machine: no global/user config can
# change which rules CI enforces.
target-version = "py311"
line-length = 100
extend-exclude = ["build", "dist", ".venv"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "F",      # pyflakes
    "W",      # pycodestyle warnings
    "I",      # import sorting
    "UP",     # pyupgrade
    "B",      # bugbear
    "SIM",    # simplify
    "RUF",    # ruff-specific
    "S",      # bandit (security)
    "BLE",    # blind except
    "ISC",    # implicit string concatenation
]
ignore = [
    "E501",   # a few long UI/log strings are clearer on one line
    # UI strings deliberately use typographic spaces (menu alignment).
    "RUF001", "RUF002", "RUF003",
    # Subprocess calls and config-sourced command lines are the application's
    # core mechanism; these bandit rules cannot distinguish them from injection.
    "S105", "S106", "S602", "S603", "S604", "S605", "S606", "S607",
]

[tool.ruff.lint.isort]
known-first-party = ["pwr_tray"]

[tool.ruff.lint.per-file-ignores]
# Assertions are the natural expression language of a test suite, and tests
# may name throw-away paths under /tmp.
"tests/*" = ["S101", "S108"]
"conftest.py" = ["S101"]
