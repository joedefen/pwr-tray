# pwr-tray -- packaging, the test gate, and the service contract
# ==============================================================
#
# Sources of truth
# ----------------
# * Build backend: flit_core.  The version lives in `pwr_tray/__init__.py`
#   only; never add `version =` to [project].  tests/test_metadata.py enforces
#   this, because a second copy of the version is how the published metadata
#   drifted from the code before.
# * Layout: the package is `pwr_tray/`; runtime resources (commands.yaml,
#   icons, systemd units) live under `pwr_tray/resources/` and ride in the
#   wheel.  `pwr-tray` is the console script (pwr_tray.main:main).
#
# The systemd units are constants
# -------------------------------
# Every shipped unit runs `%h/.local/bin/pwr-tray --de <desktop>` and never an
# installation path, so `--svc-install` produces the same file for everyone and
# no shell, venv or `which` result can change what the service runs.  The verbs
# that would start a unit refuse when that launcher is missing, dangling or not
# executable; `--svc-status`, `--svc-stop` and `--svc-uninstall` do not.
# `service.installation()` reads pip's `direct_url.json` next to the installed
# metadata to tell an editable install of a checkout from a *frozen* copy of it
# (`pip install .` into a project virtualenv), and says so rather than letting
# a restart silently reload the frozen copy.  Pinned by
# tests/test_service_commands.py, tests/test_service_examples.py and
# tests/test_service_provenance.py.
#
# Development
# -----------
# `./runner` runs this tree immediately (`python -m pwr_tray.main --replace`).
# For the install layout, the dev loop, how to tell which code a running applet
# actually loaded, the test inventory and the release checklist in detail, see
# README-DEV.md.  The essentials:
#
#   python3 -m venv .venv
#   .venv/bin/python -m pip install -e '.[dev]'
#   .venv/bin/python -m ruff check .
#   .venv/bin/python -m compileall -q pwr_tray
#   .venv/bin/python -m pytest -q          # a few hundred tests, about a second
#
# Tests never touch ~/.config: conftest.py redirects HOME to a temporary
# directory and stubs PyQt5/ruamel.yaml/psutil when they are absent, so the
# suite runs in a bare container as well as on a desktop.
#
# Releasing
# ---------
#   1. bump `__version__` in pwr_tray/__init__.py (the only place)
#   2. run the test gate; commit; tag `vX.Y.Z`; push with tags
#   3. python -m build                  # dist/*.whl and dist/*.tar.gz
#   4. python -m twine check dist/*
#   5. python -m twine upload dist/*    # TWINE_USERNAME=__token__,
#                                       # TWINE_PASSWORD=pypi-...
#   6. install the artifact into a scratch environment (pipx install
#      --force ./dist/pwr_tray-X.Y.Z-py3-none-any.whl) and check
#      `pwr-tray --version` and `pwr-tray --list-des`, so the index cannot
#      serve a wheel that the tree never ran (audit finding F1).

[build-system]
requires = ["flit_core>=3.4"]
build-backend = "flit_core.buildapi"

[project]
name = "pwr_tray"
description = "A PyQt5 tray applet for power management on i3, sway, niri, Hyprland, and KDE"
# `pwr_tray/__init__.py:__version__` is the single source of truth.  Flit reads
# it from the module at build time, so the version is never duplicated here.
dynamic = ["version"]
authors = [
    { name = "Joe Defen", email = "joedef@google.com" }
]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["power", "energy", "PyQt5", "applet", "tray", "kde", "i3wm", "sway", "niri", "hyprland"]
classifiers = [
    "Environment :: X11 Applications :: Qt",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux"
]
dependencies = [
    'psutil>=5.9',
    'PyQt5>=5.15',     # also supplies QtDBus, used for tray detection
    'ruamel.yaml>=0.17',
]

[project.urls]
"Homepage" = "https://github.com/joedefen/pwr-tray"
"Bug Tracker" = "https://github.com/joedefen/pwr-tray/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pytest-cov>=5",
    "ruff>=0.6",
    "build>=1.2",
    "twine>=5",
]

[project.scripts]
pwr-tray = "pwr_tray.main:main"

[tool.flit.sdist]
include = ["pwr_tray/resources/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
branch = true
source = ["pwr_tray"]

[tool.coverage.report]
skip_covered = true

[tool.ruff]
# Keep the lint gate identical on every machine: no global/user config can
# change which rules CI enforces.
target-version = "py311"
line-length = 100
extend-exclude = ["build", "dist", ".venv"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "F",      # pyflakes
    "W",      # pycodestyle warnings
    "I",      # import sorting
    "UP",     # pyupgrade
    "B",      # bugbear
    "SIM",    # simplify
    "RUF",    # ruff-specific
    "S",      # bandit (security)
    "BLE",    # blind except
    "ISC",    # implicit string concatenation
]
ignore = [
    "E501",   # a few long UI/log strings are clearer on one line
    # UI strings deliberately use typographic spaces (menu alignment).
    "RUF001", "RUF002", "RUF003",
    # Subprocess calls and config-sourced command lines are the application's
    # core mechanism; these bandit rules cannot distinguish them from injection.
    "S105", "S106", "S602", "S603", "S604", "S605", "S606", "S607",
]

[tool.ruff.lint.isort]
known-first-party = ["pwr_tray"]

[tool.ruff.lint.per-file-ignores]
# Assertions are the natural expression language of a test suite, and tests
# may name throw-away paths under /tmp.
"tests/*" = ["S101", "S108"]
"conftest.py" = ["S101"]
