[build-system]
requires = ["flit_core>=3.4"]
build-backend = "flit_core.buildapi"

[project]
name = "pwr_tray"
version = "1.0.13"
description = "A PyQt5 tray applet for power management on i3, sway, niri, Hyprland, and KDE"
authors = [
    { name = "Joe Defen", email = "joedef@google.com" }
]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["power", "energy", "PyQt5", "applet", "tray", "kde", "i3wm", "sway", "niri", "hyprland"]
classifiers = [
    "Environment :: X11 Applications :: Qt",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux"
]
dependencies = [
    'psutil>=5.9',
    'PyQt5>=5.15',     # also supplies QtDBus, used for tray detection
    'ruamel.yaml>=0.17',
]

[project.urls]
"Homepage" = "https://github.com/joedefen/pwr-tray"
"Bug Tracker" = "https://github.com/joedefen/pwr-tray/issues"

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
pwr-tray = "pwr_tray.main:main"

[tool.flit.sdist]
include = ["pwr_tray/resources/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
