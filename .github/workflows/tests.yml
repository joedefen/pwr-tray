name: tests

# The suite is deliberately dependency-light: the root conftest.py stubs the
# GUI / D-Bus / YAML imports that pwr_tray.main performs at module scope, so CI
# needs nothing beyond pytest.  Real dependencies are used automatically when
# they happen to be installed (as on a developer desktop).

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.8', '3.9', '3.10', '3.11', '3.12', '3.13']

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest

      - name: Byte-compile every module
        run: python -m compileall -q pwr_tray

      - name: Report which runtime dependencies are real vs stubbed
        run: |
          python - <<'PY'
          import importlib.util

          for name in ('PyQt5', 'pydbus', 'ruamel.yaml', 'psutil'):
              try:
                  found = importlib.util.find_spec(name) is not None
              except (ImportError, AttributeError):
                  found = False
              print(f'{name:12} {"installed" if found else "stubbed by conftest"}')
          PY

      - name: Run tests
        run: python -m pytest -v
